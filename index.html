<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<style>
/* Одноэкранная аркада: холст во весь экран, поверх — геймпад «как на Nintendo» */
:root{
  --bg:#0e0b16; --ink:#fff6e0; --edge:rgba(255,246,224,.6);
  --pad:rgba(18,14,30,.5); --gas:#35b552; --brake:#e0453a; --nitro:#2f8cff; --horn:#f4b81c;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--ink);font-family:"Pixelify Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;background:var(--bg);touch-action:none;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.ctl{position:absolute;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(42vh,178px);height:min(42vh,178px);touch-action:none}
#pad{left:calc(10px + env(safe-area-inset-left,0px))}
#btns{right:calc(10px + env(safe-area-inset-right,0px))}
/* Геймпад в духе SNES: серая лунка с чёрным крестом слева, цветные A/B/X/Y справа */
#pad::before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 50% 42%,#d9d9e0 0,#bdbdc7 62%,#a3a3ae 100%);box-shadow:inset 0 3px 7px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.4);opacity:.82}
#pad .cross{position:absolute;inset:14%}
#pad .arm{position:absolute;background:linear-gradient(#3a3a40,#1c1c20);box-shadow:0 2px 0 #0d0d10,inset 0 1px 0 rgba(255,255,255,.12);border-radius:5px}
#pad .h{left:0;right:0;top:34%;height:32%}
#pad .v{top:0;bottom:0;left:34%;width:32%}
#pad .dimple{position:absolute;left:41%;top:41%;width:18%;height:18%;border-radius:50%;background:radial-gradient(circle at 45% 40%,#16161a,#2c2c31);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
#pad .ar{position:absolute;width:0;height:0;border:solid transparent;transition:filter .05s}
#pad .ar.l{left:5%;top:50%;margin-top:-7px;border-width:7px 10px 7px 0;border-right-color:#5a5a62}
#pad .ar.r{right:5%;top:50%;margin-top:-7px;border-width:7px 0 7px 10px;border-left-color:#5a5a62}
#pad .ar.u{top:5%;left:50%;margin-left:-7px;border-width:0 7px 10px 7px;border-bottom-color:#5a5a62}
#pad .ar.d{bottom:5%;left:50%;margin-left:-7px;border-width:10px 7px 0 7px;border-top-color:#5a5a62}
#pad .ar.l.on{border-right-color:#e8e8ee}#pad .ar.r.on{border-left-color:#e8e8ee}#pad .ar.u.on{border-bottom-color:#e8e8ee}#pad .ar.d.on{border-top-color:#e8e8ee}
#btns .well{position:absolute;left:50%;top:50%;width:108%;height:62%;margin:-31% 0 0 -54%;border-radius:999px;background:linear-gradient(#a7a6b2,#8e8d9a);box-shadow:inset 0 3px 6px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.35);transform:rotate(-28deg);opacity:.8}
.b{position:absolute;width:34%;height:34%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 -3px 5px rgba(0,0,0,.3),inset 0 3px 4px rgba(255,255,255,.35);transform:translateY(0);transition:transform .05s,box-shadow .05s,filter .05s;touch-action:none}
.b b{font:700 clamp(11px,3.4vh,17px)/1 "Pixelify Sans",system-ui,sans-serif;color:rgba(0,0,0,.42);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.b span{font:600 clamp(7px,2vh,10px)/1 "Pixelify Sans",system-ui,sans-serif;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.55)}
.b.on{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 -2px 4px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.3);filter:brightness(1.12)}
#bGas{left:33%;bottom:2%;background:radial-gradient(circle at 40% 35%,#ffe066,#e6b200 70%,#b98c00)}
#bBrake{right:2%;top:33%;background:radial-gradient(circle at 40% 35%,#ff6a5c,#d6281f 70%,#9c1a13)}
#bNitro{left:2%;top:33%;background:radial-gradient(circle at 40% 35%,#5fd38a,#1f9a4a 70%,#136c33)}
#bHorn{left:33%;top:2%;background:radial-gradient(circle at 40% 35%,#6f93ff,#2a55c7 70%,#1a3a8f)}
#bGas span{color:#3a2a00;text-shadow:0 1px 0 rgba(255,255,255,.4)}
#pause{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));width:38px;height:30px;border-radius:6px;border:2px solid var(--edge);background:var(--pad);color:var(--ink);font:12px/1 "Press Start 2P",monospace;padding:0}
#pause:focus-visible{outline:2px solid #ffd56a}
#rotate{position:absolute;inset:0;background:#120e1f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:0 24px;z-index:5}
#rotate .ph{width:46px;height:80px;border:4px solid var(--ink);border-radius:9px;animation:rot 2.2s ease-in-out infinite}
#rotate p{margin:0;font:600 20px/1.35 "Pixelify Sans",system-ui,sans-serif;max-width:22ch}
#rotate small{font:14px/1.4 "Pixelify Sans",system-ui,sans-serif;opacity:.7}
@keyframes rot{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(90deg)}}
</style>
</head>
<body>

<div id="game">
  <canvas id="c" width="400" height="216" aria-label="Игра Айда кайрамар"></canvas>
  <div id="pad" class="ctl" hidden>
    <div class="cross"><div class="arm h"></div><div class="arm v"></div><div class="dimple"></div>
    <i class="ar l"></i><i class="ar r"></i><i class="ar u"></i><i class="ar d"></i></div>
  </div>
  <div id="btns" class="ctl" hidden>
    <div class="well"></div>
    <div class="b" id="bHorn" data-k="horn"><b>X</b><span>БИБИ</span></div>
    <div class="b" id="bNitro" data-k="nitro"><b>Y</b><span>НИТРО</span></div>
    <div class="b" id="bBrake" data-k="brake"><b>A</b><span>ТОРМОЗ</span></div>
    <div class="b" id="bGas" data-k="gas"><b>B</b><span>ГАЗ</span></div>
  </div>
  <button id="pause" type="button" aria-label="Пауза" hidden>II</button>
  <div id="rotate" hidden>
    <div class="ph"></div>
    <p>Поверни телефон горизонтально</p>
    <small>Игра «Айда кайрамар» играется лёжа на боку</small>
  </div>
</div>

<script>
(()=>{
'use strict';
const PX='"Press Start 2P", monospace', PF='"Pixelify Sans", monospace', TF='"Rubik Mono One", "Press Start 2P", sans-serif';
const cv=document.getElementById('c');let g=cv.getContext('2d');
const gameEl=document.getElementById('game'),padEl=document.getElementById('pad'),btnsEl=document.getElementById('btns'),pauseEl=document.getElementById('pause'),rotEl=document.getElementById('rotate');
let W=400;const H=216;let portrait=false;
const HZ=70,DASH=124;

function resize(){
  const r=gameEl.getBoundingClientRect();
  const a=Math.max(1,r.width)/Math.max(1,r.height);
  portrait=r.height>r.width*1.02;
  W=Math.round(Math.min(480,Math.max(300,H*a)));
  cv.width=W;cv.height=H;g=cv.getContext('2d');g.imageSmoothingEnabled=false;
  rotEl.hidden=!portrait;
  if(portrait&&state==='race')paused=true;
}

/* ===================== утилиты ===================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
function poly(c,...p){g.fillStyle=c;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath();g.fill()}
function circ(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function rrect(x,y,w,h,r,c){g.fillStyle=c;g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill()}
function txt(s,x,y,size,col,align,font,outline){
  g.font=size+'px '+(font||PX);g.textAlign=align||'left';g.textBaseline='top';
  if(outline){g.fillStyle=outline;for(const[dx,dy]of[[-1,0],[1,0],[0,-1],[0,1],[1,1]])g.fillText(s,x+dx,y+dy)}
  g.fillStyle=col;g.fillText(s,x,y);
}
function wrap(s,maxW,size,font){g.font=size+'px '+(font||PF);const words=s.split(' ');const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t}if(cur)lines.push(cur);return lines}

/* ===================== графика машин: кузова и салоны ===================== */
const ART=(()=>{
/* Mazda 6 (GJ, 2016), Soul Red — пиксель-арт. Профиль обведён по присланному фото. */
const PAL={
  body:'#b5121b',hi:'#d8222b',hi2:'#f04a50',spec:'#ff9a9a',mid:'#9a0f17',dark:'#6e0a10',deep:'#420609',
  chrome:'#dfe3e8',chrome2:'#9aa2ab',glass:'#16202c',glass2:'#2c3d50',refl:'#7f98b0',
  tire:'#141416',tire2:'#2a2a2e',rim:'#c9ced4',rim2:'#8e959d',rimDark:'#3c4148',
  lamp:'#eef3f7',lampIn:'#56616d',tail:'#c40d1a',tailHi:'#ff4f5a',tailDk:'#7a0810',outline:'#1c0608'
};
/* ---------- вид сбоку: 240×80, координаты снимаются с фото и переводятся в пиксели ---------- */
function drawSide(c){
  const P=PAL;const X=px=>(px-66)*0.2875+2,Y=py=>(py-928)*0.2875+4;
  const pts=a=>{const o=[];for(let i=0;i<a.length;i+=2)o.push(X(a[i]),Y(a[i+1]));return o};
  const path=(a)=>{const p=pts(a);c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath()};
  const fill=(a,col)=>{path(a);c.fillStyle=col;c.fill()};
  const line=(a,col,w)=>{const p=pts(a);c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.strokeStyle=col;c.lineWidth=w||1;c.stroke()};
  const circ=(px,py,r,col)=>{c.beginPath();c.arc(X(px),Y(py),r,0,Math.PI*2);c.fillStyle=col;c.fill()};
  const BODY=[78,1136,70,1112,67,1072,69,1050,78,1036,112,1022,172,1012,240,1005,302,998,362,975,432,945,482,935,532,931,592,933,642,940,692,958,740,981,790,992,846,990,860,992,864,1001,871,1022,873,1080,869,1110,856,1131,780,1136];
  // тень на земле
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(X(470),Y(1172),X(860)-X(470),3.2,0,0,Math.PI*2);c.fill();
  // кузов: заливка и тональные зоны
  fill(BODY,P.body);
  c.save();path(BODY);c.clip();
  const g=c.createLinearGradient(0,Y(990),0,Y(1136));g.addColorStop(0,P.hi);g.addColorStop(0.28,P.hi);g.addColorStop(0.32,P.body);g.addColorStop(0.72,P.mid);g.addColorStop(1,P.dark);
  c.fillStyle=g;c.fillRect(0,Y(985),240,80);
  // капот и крыша — светлее
  fill([69,1050,78,1036,112,1022,172,1012,240,1005,302,998,300,1008,230,1014,160,1022,110,1032,80,1046],P.hi2);
  fill([432,945,482,935,532,931,592,933,642,940,640,944,590,938,532,936,482,940,435,950],P.hi2);
  // крышка багажника
  fill([740,981,790,992,846,990,860,992,858,997,800,998,745,988],P.hi2);
  // плечевая линия (характерная «волна» Mazda) — блик над ней
  line([115,1036,200,1030,300,1029,420,1029,560,1027,680,1022,780,1014,862,1008],P.spec,1);
  line([115,1038,200,1032,300,1031,420,1031,560,1029,680,1024,780,1016,862,1010],P.dark,1);
  // нижняя вогнутая линия дверей, поднимается к заднему колесу
  fill([300,1100,420,1092,540,1084,640,1074,700,1062,700,1068,640,1082,540,1092,420,1100,300,1108],P.deep);
  line([300,1097,420,1089,540,1081,640,1071,700,1059],P.hi,1);
  // переднее крыло над колесом
  line([150,1048,190,1046,250,1050,290,1062],P.hi,1);
  c.restore();
  // арки колёс
  for(const[wx,wy]of[[222,1112],[702,1112]]){c.save();c.beginPath();c.rect(0,0,240,Y(1134));c.clip();circ(wx,wy,19.2,P.deep);circ(wx,wy,18.4,'#0c0c0e');c.restore()}
  // стёкла
  const GL=[330,1003,372,972,432,947,500,940,560,939,625,944,672,961,706,985,700,990];
  fill(GL,P.glass);
  c.save();path(GL);c.clip();
  c.fillStyle=P.glass2;c.fillRect(X(330),Y(975),X(706)-X(330),Y(1003)-Y(975));
  c.fillStyle=P.refl;for(const x0 of[392,560]){c.beginPath();c.moveTo(X(x0),Y(1003));c.lineTo(X(x0+40),Y(938));c.lineTo(X(x0+58),Y(938));c.lineTo(X(x0+18),Y(1003));c.fill()}
  c.restore();
  // стойки: B и узкая перед форточкой
  fill([500,940,512,940,512,1002,500,1003],'#0b0c0f');
  fill([627,944,636,946,636,994,627,995],'#0b0c0f');
  // хромированная окантовка окон и молдинг по линии стёкол
  line([330,1003,372,971,432,946,500,939,560,938,625,943,672,960,708,986],P.chrome,1);
  line([326,1005,706,990],P.chrome,1.2);
  // зазоры дверей
  line([306,1004,300,1060,304,1130],P.dark,1);
  line([506,1003,508,1132],P.dark,1);
  line([646,996,650,1050,640,1078],P.dark,1);
  // ручки
  for(const[hx,hy]of[[455,1027],[632,1018]]){c.fillStyle=P.chrome2;c.fillRect(X(hx),Y(hy),7,1.6);c.fillStyle=P.chrome;c.fillRect(X(hx),Y(hy)-0.6,7,0.8)}
  // зеркало
  fill([352,990,380,982,394,990,390,1010,360,1012],P.body);fill([352,990,380,982,394,990,392,995,356,995],P.hi2);fill([360,1012,390,1010,386,1016,364,1017],'#0b0c0f');
  // лючок бензобака
  c.strokeStyle=P.mid;c.lineWidth=1;c.beginPath();c.arc(X(744),Y(1012),2.6,0,Math.PI*2);c.stroke();
  // передняя фара — узкая, вытянутая к крылу
  fill([71,1050,80,1038,168,1027,150,1040,96,1051],P.lamp);fill([84,1044,150,1036,140,1042,94,1048],P.lampIn);line([86,1041,150,1033],'#ffffff',1);
  // решётка с хромовым «крылом» под фарой
  fill([67,1052,74,1052,76,1084,68,1082],'#0b0c0f');line([68,1052,96,1054,130,1052],P.chrome,1);
  // нижний воздухозаборник / противотуманка
  fill([82,1096,132,1094,128,1112,88,1114],'#0b0c0f');line([90,1104,124,1103],P.chrome2,1);
  // задний фонарь
  fill([778,993,858,990,866,1003,834,1013,788,1009],P.outline);fill([783,995,856,993,862,1002,832,1010,792,1006],P.tailDk);fill([790,997,852,995,856,1000,830,1005,796,1003],P.tail);line([792,998,852,996],P.tailHi,1);c.fillStyle=P.tailHi;c.fillRect(X(840)-1,Y(999),2,2);
  // задний отражатель и выхлоп
  fill([846,1084,868,1084,867,1093,847,1093],P.tailDk);
  fill([826,1128,862,1127,860,1136,828,1136],P.chrome2);fill([830,1130,858,1129,857,1134,831,1134],'#2a2d31');
  // колёса: 19", пять сдвоенных спиц
  for(const[wx,wy]of[[222,1112],[702,1112]]){
    const cx=X(wx),cy=Y(wy);
    circ(wx,wy,16.6,P.tire);c.strokeStyle=P.tire2;c.lineWidth=1;c.beginPath();c.arc(cx,cy,15.6,Math.PI*1.1,Math.PI*1.6);c.stroke();
    circ(wx,wy,12.6,P.rimDark);
    for(let k=0;k<5;k++){const a0=k/5*Math.PI*2-Math.PI/2;for(const d of[-0.16,0.16]){const a=a0+d;c.strokeStyle=P.rim;c.lineWidth=1.8;c.beginPath();c.moveTo(cx+Math.cos(a)*3,cy+Math.sin(a)*3);c.lineTo(cx+Math.cos(a+d*0.6)*12,cy+Math.sin(a+d*0.6)*12);c.stroke()}}
    c.strokeStyle=P.rim2;c.lineWidth=1;c.beginPath();c.arc(cx,cy,12.2,0,Math.PI*2);c.stroke();
    c.fillStyle=P.rim;c.beginPath();c.arc(cx,cy,3,0,Math.PI*2);c.fill();c.fillStyle=P.rimDark;c.beginPath();c.arc(cx,cy,1.4,0,Math.PI*2);c.fill();
    c.fillStyle='#5a1a1a';c.fillRect(cx+4,cy-6,2,4);   // тормозной суппорт
  }
}
/* ---------- вид сзади: 128×96 — низкий широкий седан ---------- */
function drawRear(c){
  const P=PAL;
  const fill=(a,col)=>{c.beginPath();c.moveTo(a[0],a[1]);for(let i=2;i<a.length;i+=2)c.lineTo(a[i],a[i+1]);c.closePath();c.fillStyle=col;c.fill()};
  const mir=a=>{const o=[];for(let i=0;i<a.length;i+=2)o.push(128-a[i],a[i+1]);return o};
  const both=(a,col)=>{fill(a,col);fill(mir(a),col)};
  const R=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  c.fillStyle='rgba(0,0,0,.4)';c.beginPath();c.ellipse(64,92,62,3.5,0,0,Math.PI*2);c.fill();
  R(9,72,18,20,P.tire);R(101,72,18,20,P.tire);R(10,73,4,18,P.tire2);R(114,73,4,18,P.tire2);
  // кузов: узкая покатая кабина, широкие плечи
  fill([42,8,86,8,94,12,106,30,118,36,123,46,124,58,122,72,117,82,11,82,6,72,4,58,5,46,10,36,22,30,34,12],P.body);
  fill([42,8,86,8,90,10,38,10],P.hi2);
  both([34,12,42,10,28,30,22,30],P.hi);
  // плечи над колёсами — светлые блики
  both([10,36,22,31,26,33,12,39],P.hi2);
  // зеркала
  both([3,28,10,26,11,31,4,32],P.body);both([4,31,10,31,10,33,5,33],'#0b0c0f');
  // заднее стекло — пологое, неглубокое
  fill([43,11,85,11,99,30,29,30],P.glass);fill([45,13,83,13,94,27,34,27],P.glass2);fill([49,13,57,13,44,27,37,27],P.refl);
  R(56,12,16,1,'#e01b28');R(62,5,4,3,'#0b0c0f');R(63,4,2,1,'#0b0c0f');
  // крышка багажника и утиный хвостик

    if(fogA>0.4&&!eggSeen.fog){eggSeen.fog=1;egg('Запотевание теплообменника — это норма',3.2)}}

  tukT=Math.max(0,tukT-dt);

  // боты и трафик

  for(const b of bots){

  // ямы

  // ДПС
  for(const d of dpsList){if(!d.done&&lastPZ<d.z-1600&&pz>=d.z-1600){d.done=true;const kmh=speed/MAX*180;if(kmh>d.lim+10){fines+=500;sSiren();say('ДПС: '+Math.round(kmh)+' вместо '+d.lim+'. Штраф 500 ₽',1.6)}}}

/* ===================== отрисовка гонки ===================== */
function proj(p,cx,cy,cz,wf){p.cxw=-cx;p.cyw=p.wy-cy;p.cz=p.wz-cz;p.sc=CD/p.cz;p.sx=Math.round(W/2+p.sc*p.cxw*W/2);p.sy=Math.round(HZ-p.sc*p.cyw*W/2);p.sw=Math.round(p.sc*ROADW*wf*W/2)}
function renderSeg(s,n){
  const a=s.alt;const x1=s.p1.sx,y1=s.p1.sy,w1=s.p1.sw,x2=s.p2.sx,y2=s.p2.sy,w2=s.p2.sw;
  const hh=y1-y2,xm=Math.round((x1+x2)/2);
  g.fillStyle=s.gl[0];g.fillRect(0,y2,xm,hh);g.fillStyle=s.gr[0];g.fillRect(xm,y2,W-xm,hh);
  const rd=Math.max(6,2*s.lanes),r1=w1/rd,r2=w2/rd;
  if(s.water){poly('#c5bfb1',x1-w1-r1*4,y1,x1-w1,y1,x2-w2,y2,x2-w2-r2*4,y2)}
  poly(s.kerb[a],x1-w1-r1,y1,x1-w1,y1,x2-w2,y2,x2-w2-r2,y2);
  poly(s.kerb[a],x1+w1+r1,y1,x1+w1,y1,x2+w2,y2,x2+w2+r2,y2);
  poly(s.road[0],x1-w1,y1,x1+w1,y1,x2+w2,y2,x2-w2,y2);
  if(s.edge){const e1=w1/40,e2=w2/40;poly('#e8e8e8',x1-w1+e1,y1,x1-w1+e1*2.2,y1,x2-w2+e2*2.2,y2,x2-w2+e2,y2);poly('#e8e8e8',x1+w1-e1*2.2,y1,x1+w1-e1,y1,x2+w2-e2,y2,x2+w2-e2*2.2,y2)}
  if(s.lane&&a){const l1=w1/34,l2=w2/34;for(let ln=1;ln<s.lanes;ln++){const f=-1+2*ln/s.lanes;const lx1=x1+w1*f,lx2=x2+w2*f;poly(s.lane,lx1-l1/2,y1,lx1+l1/2,y1,lx2+l2/2,y2,lx2-l2/2,y2)}}
  if(s.mid){const m1=w1*0.12,m2=w2*0.12;poly('#6f9a3c',x1-m1,y1,x1+m1,y1,x2+m2,y2,x2-m2,y2)}
  if(s.zig){const k=(s.i%2)?0.62:0.78,k2=(s.i%2)?0.78:0.62;const z1=w1/45,z2=w2/45;poly('#f2c418',x1+w1*k-z1,y1,x1+w1*k+z1,y1,x2+w2*k2+z2,y2,x2+w2*k2-z2,y2)}
  
}
function drawSpr(img,ww,sc,x,y,ox,oy,clipY){
  const dw=ww*sc*W/2;if(dw<0.6||dw>W*6)return;const dh=dw*img.height/img.width;
  const dx=x+dw*ox,dy=y+dh*oy;const ch=clipY?Math.max(0,dy+dh-clipY):0;if(ch>=dh)return;
  g.drawImage(img,0,0,img.width,img.height-(img.height*ch/dh),Math.round(dx),Math.round(dy),Math.round(dw),Math.round(dh-ch));
  return {dw,dx,dy};
}
function drawRace(){

    proj(s.p1,camX-x,camY,position,s.w1);proj(s.p2,camX-x-dx,camY,position,s.w2);x+=dx;dx+=s.curve;

  {const hz=g.createLinearGradient(0,HZ-2,0,HZ+26);hz.addColorStop(0,'rgba(207,226,238,.75)');hz.addColorStop(1,'rgba(207,226,238,0)');g.fillStyle=hz;g.fillRect(0,HZ-2,W,28)}

  const pw=Math.round(Math.min(196,W*0.46)),px=8,py=30;
  g.drawImage(S.shed.img,Math.round(W*0.6)-30,gy-26,28,28);g.drawImage(S.gazebo.img,pw+16,gy-38,Math.max(30,Math.round(W*0.6)-pw-44),44);
  for(let i=0;i<6;i++){R(W*0.5+i*14,gy+6+i*2,2,4,'#ddd');circ(W*0.5+i*14+1,gy+6+i*2,2,'#fff8c8')}
  const C=CARS[carIdx];const fcw=190,fch=Math.round(fcw*C.side.height/C.side.width);g.drawImage(C.side,Math.round(W*0.52),H-24-fch,fcw,fch);
  if(C.id==='cx9'&&mud>0.05){g.globalAlpha=Math.min(0.85,mud+0.2);for(const m of MUD.slice(0,22))circ(W*0.52+15+m.x*120,H-56+m.y*18,2+m.s*0.3,'#5b4429');g.globalAlpha=1}
  const me=results.findIndex(r=>r.player)+1;
  banner(me===1?'ПРИЕХАЛИ НА ДАЧУ ПЕРВЫМИ!':'ПРИЕХАЛИ НА ДАЧУ!');
  // итоги заезда
  rrect(px,py,pw,72,5,'rgba(10,8,20,.8)');
  txt(me+' МЕСТО',px+8,py+5,9,me===1?'#ffd56a':'#fff','left',PX);txt(DIFF[diffIdx].name,px+pw-8,py+5,8,'#a99ccc','right',PF);
  results.forEach((r,i)=>{const yy=py+19+i*11;if(r.player)R(px+4,yy-1,pw-8,11,'rgba(255,213,106,.25)');R(px+8,yy+2,5,5,r.dot);txt((i+1)+'. '+r.name+(r.player?' (ты)':''),px+16,yy,9,'#fff','left',PF);txt(fmt(r.time),px+pw-8,yy,9,'#cfe6ff','right',PF)});
  if(fines)txt('Штрафы ДПС: '+fines+' ₽',px+8,py+62,8,'#ff9a8a','left',PF);
  // рекорды трассы
  const board=boardFor(trackIdx,diffIdx).slice(0,3);const ry=py+76;rrect(px,ry,pw,14+Math.max(1,board.length)*10,5,'rgba(10,8,20,.8)');
  txt('РЕКОРДЫ · '+CITIES[trackIdx].name,px+8,ry+4,6,'#ffd56a','left',PX);
  if(newRec)txt(newRec,px+pw-8,ry+3,8,'#7dff9a','right',PF);
  if(!board.length)txt('пока пусто',px+8,ry+14,9,'#a99ccc','left',PF);
  board.forEach((r,i)=>{const yy=ry+13+i*10;txt((i+1)+'. '+carName(r.car)+(r.mine?' (ты)':''),px+8,yy,9,r.mine?'#fff3a8':'#fff','left',PF);txt(fmt(r.t),px+pw-8,yy,9,'#cfe6ff','right',PF)});
  // шутка
  const bad=crashes>2||(C.id==='cx9'&&mud>0.3)||(C.id==='opel'&&eggSeen.fog)||(C.id==='m6'&&eggSeen.sb);
  const joke=(bad?C.end.bad:C.end.good)+(me===4?' Шашлык жарит тот, кто приехал последним!':'');
  g.font='9px '+PF;const jw=Math.min(W-pw-30,g.measureText(joke).width+12);const jl=wrap(joke,jw-10,9);const jx=W-jw-8,jy=30;
  rrect(jx,jy,jw,jl.length*10+5,4,'rgba(10,8,20,.72)');jl.forEach((l,i)=>txt(l,jx+5,jy+3+i*10,9,'#fff3a8','left',PF));
  const bw=Math.round((W-32)/3),by=H-20;
  button(8,by,bw,16,'ЕЩЁ РАЗ',()=>startRace(),selBtn===0);button(16+bw,by,bw,16,'ГОРОД',()=>{state='track';musOn=true;sBlip()},selBtn===1);button(24+bw*2,by,bw,16,'МАШИНА',()=>{state='car';musOn=true;sBlip()},selBtn===2);
}
function drawPause(){g.fillStyle='rgba(8,6,16,.72)';g.fillRect(0,0,W,H);txt('ПАУЗА',W/2,30,14,'#ffd56a','center',PX,'#000');
  const bw=150,x=Math.round(W/2-bw/2);button(x,62,bw,20,'ПРОДОЛЖИТЬ',()=>{paused=false},true);button(x,88,bw,20,'ЗАНОВО',()=>{startRace()});button(x,114,bw,20,muted?'ЗВУК: НЕТ':'ЗВУК: ДА',()=>setMute(!muted));button(x,140,bw,20,'В МЕНЮ',()=>{paused=false;stopVoice();state='title';setControls(false);setEngine(0,false);hornOff();musOn=true})}
function pickCar(d){carIdx=(carIdx+d)%4;sBlip();playVoice(CARS[carIdx].id)}
function goCar(){initAudio();musOn=true;state='car';sBlip();playVoice(CARS[carIdx].id)}
function goTrack(){state='track';trackSel=trackIdx;sBlip()}
function toggleFS(){initAudio();const d=document;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const el=document.documentElement;const p=(el.requestFullscreen||el.webkitRequestFullscreen);if(p){const r=p.call(el);if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>say('Полный экран здесь недоступен',2.2))}else say('Полный экран здесь недоступен',2.2)}}catch(e){say('Полный экран здесь недоступен',2.2)}}
function setControls(on){padEl.hidden=!on;btnsEl.hidden=!on;pauseEl.hidden=!on;if(!on){for(const k in inp)inp[k]=false;refreshPad()}}

/* ===================== ввод ===================== */
function refreshPad(){padEl.querySelector('.l').classList.toggle('on',inp.left);padEl.querySelector('.r').classList.toggle('on',inp.right);padEl.querySelector('.u').classList.toggle('on',inp.up);padEl.querySelector('.d').classList.toggle('on',inp.down)}
const padPtrs=new Map();
function padFrom(){let l=false,r=false,u=false,d=false;const rc=padEl.getBoundingClientRect();for(const p of padPtrs.values()){const dx=(p.x-rc.left)/rc.width-0.5,dy=(p.y-rc.top)/rc.height-0.5;if(dx<-0.12)l=true;if(dx>0.12)r=true;if(dy<-0.2&&Math.abs(dy)>Math.abs(dx)*0.6)u=true;if(dy>0.2&&Math.abs(dy)>Math.abs(dx)*0.6)d=true}inp.left=l;inp.right=r;inp.up=u;inp.down=d;refreshPad()}
padEl.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();padEl.setPointerCapture(e.pointerId);padPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});padFrom()});
padEl.addEventListener('pointermove',e=>{if(padPtrs.has(e.pointerId)){padPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});padFrom()}});
for(const ev of['pointerup','pointercancel','lostpointercapture'])padEl.addEventListener(ev,e=>{padPtrs.delete(e.pointerId);padFrom()});
for(const b of btnsEl.querySelectorAll('.b')){const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();b.setPointerCapture(e.pointerId);inp[k]=true;b.classList.add('on');if(k==='horn')hornOn()});
  const up=()=>{inp[k]=false;b.classList.remove('on');if(k==='horn')hornOff()};
  for(const ev of['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,up)}
pauseEl.addEventListener('click',()=>{if(state==='race'||state==='count'){paused=!paused;if(paused){setEngine(0,false);hornOff()}}});
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();const p=toCanvas(e);swipeX=p.x;
  const hs=hits.slice().reverse();for(const h of hs)if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){if(state==='car'&&h.w>=W-1)break;h.cb();swipeX=null;return}});
cv.addEventListener('pointerup',e=>{if(state==='car'&&swipeX!==null){const p=toCanvas(e);const d=p.x-swipeX;if(Math.abs(d)>40)pickCar(d<0?1:3)}swipeX=null});
document.addEventListener('contextmenu',e=>e.preventDefault());
const KM={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',KeyX:'gas',KeyZ:'brake',KeyC:'nitro',ShiftLeft:'nitro',ShiftRight:'nitro',KeyH:'horn',KeyV:'horn',Space:'gas'};
addEventListener('keydown',e=>{const k=KM[e.code];initAudio();
  if(e.code==='Escape'||e.code==='KeyP'){if(state==='race'||state==='count'){paused=!paused;if(paused){setEngine(0,false);hornOff()}}return}
  if(state==='title'&&(e.code==='Enter'||e.code==='Space'||e.code==='KeyX')){goCar();return}
  if(state==='car'){if(e.code==='ArrowLeft')pickCar(3);else if(e.code==='ArrowRight')pickCar(1);else if(e.code==='Enter'||e.code==='Space'||e.code==='KeyX')goTrack();return}
  if(state==='track'){if(e.code==='ArrowLeft'||e.code==='ArrowRight')trackSel^=1;else if(e.code==='ArrowUp'||e.code==='ArrowDown')trackSel^=2;else if(e.code==='Enter'||e.code==='Space'||e.code==='KeyX'){trackIdx=trackSel;startRace()}else if(e.code==='Escape')state='car';return}
  if(state==='finish'){if(e.code==='ArrowLeft')selBtn=(selBtn+2)%3;else if(e.code==='ArrowRight')selBtn=(selBtn+1)%3;else if(e.code==='Enter'||e.code==='Space'){if(selBtn===0)startRace();else if(selBtn===1){state='track'}else state='car'}return}
  if(k){e.preventDefault();if(k==='horn'&&!inp.horn)hornOn();inp[k]=true}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){inp[k]=false;if(k==='horn')hornOff()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='race'||state==='count')paused=true;if(AC)AC.suspend()}else if(AC)AC.resume()});
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

/* ===================== цикл ===================== */
let last=performance.now(),acc=0,tAll=0;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000);last=now;tAll+=dt;
  if(state!=='load'){
    if(!paused&&!portrait){acc+=dt;let n=0;while(acc>=1/60&&n<6){update(1/60);acc-=1/60;n++;prevInp={...inp}}if(n===6)acc=0}else acc=0;
    musicTick();
    hits=[];
    if(state==='title')drawTitle(tAll);
    else if(state==='car')drawCar(tAll);
    else if(state==='track')drawTrackSel(tAll);
    else if(state==='race'||state==='count'){drawRace();if(paused)drawPause()}
    else if(state==='finish'){drawFinish(tAll);if(toast)drawToast()}
  }else{g.fillStyle='#0e0b16';g.fillRect(0,0,W,H);txt('ЗАГРУЗКА…',W/2,H/2-4,8,'#ffd56a','center','monospace')}
  requestAnimationFrame(frame);
}
resize();requestAnimationFrame(frame);
const fontLoad=Promise.all(['8px "Press Start 2P"','10px "Pixelify Sans"','30px "Rubik Mono One"'].map(f=>document.fonts?document.fonts.load(f,'АЙДА').catch(()=>{}):Promise.resolve()));
Promise.race([fontLoad,new Promise(r=>setTimeout(r,3000))]).then(()=>{buildSprites();buildBG();buildTrack(0);state='title';initRecords()});
window.__aida={get hwyStart(){return hwyStart},get countryStart(){return countryStart},get geese(){return geese},get fines(){return fines},get state(){return state},set state(v){state=v},startRace,inp,get position(){return position},set position(v){position=v},setCar:i=>carIdx=i,setTrack:i=>trackIdx=i,get finishZ(){return finishZ},get bots(){return bots},endRace,get speed(){return speed},get px(){return playerX},get raceT(){return raceT},set speed(v){speed=v}};
})();
